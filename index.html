<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>寻访实验台</title><link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
<main>
  <header class="masthead"><h1>寻访实验台</h1><button id="example" type="button">载入示例</button></header>
  <section class="studio" aria-label="路线对比">
    <div class="comparison">
      <div class="chart-header">
        <div><h2>路线对比</h2><p id="unit">每小时独有符合数</p></div>
        <div class="metric-switch" role="group" aria-label="对比指标">
          <button type="button" data-metric="perHour" aria-pressed="true">效率</button>
          <button type="button" data-metric="unique" aria-pressed="false">样本</button>
        </div>
      </div>
      <div class="plot">
        <div class="bar-row"><span>路线 A</span><div class="track" aria-hidden="true"><div id="bar-a"></div></div><strong id="rate-a">—</strong></div>
        <div class="bar-row"><span>路线 B</span><div class="track" aria-hidden="true"><div id="bar-b"></div></div><strong id="rate-b">—</strong></div>
        <div class="axis" aria-hidden="true"><span>0</span><span id="scale-mid"></span><span id="scale-end"></span></div>
      </div>
      <p id="totals"></p>
      <div class="crossover" id="crossover" hidden>
        <div class="crossover-heading">
          <div><h3>效率分界</h3><p id="crossover-caption"></p></div>
          <button id="try-crossover" type="button"></button>
        </div>
        <div class="crossover-map" aria-hidden="true">
          <div class="crossover-rail"><span class="crossover-marker"></span><span class="crossover-cursor"></span></div>
          <div class="crossover-labels"><span>路线 B 更快</span><span>路线 A 更快</span></div>
        </div>
      </div>
    </div>
    <aside class="scenario" aria-label="用时试算">
      <div class="scenario-head"><h2>用时试算</h2><button id="reset-scenario" type="button" disabled>还原</button></div>
      <label for="scenario-a">路线 A <output id="minutes-a" for="scenario-a"></output></label>
      <input id="scenario-a" type="range" min="1" max="120" value="30">
      <label for="scenario-b">路线 B <output id="minutes-b" for="scenario-b"></output></label>
      <input id="scenario-b" type="range" min="1" max="120" value="30">
      <div class="verdict"><h3 id="verdict-label">下一轮</h3><p id="recommendation" role="status"></p></div>
    </aside>
  </section>
  <section class="brief" aria-label="实验设置">
    <div class="brief-heading"><h2>实验记录</h2><p id="adjustment"></p></div>
    <label>岗位<input id="job" maxlength="100"></label>
    <label>必要条件<textarea id="criteria" rows="3" maxlength="500"></textarea></label>
  </section>
  <div class="routes" id="routes"></div>
  <p id="storage" role="status"></p>
</main>
</body>
</html>
