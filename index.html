<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>寻访实验台</title><link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
<main>
  <header class="hero">
    <h1>寻访<br>实验台<span>.</span></h1>
    <div class="comparison">
      <h2>独有符合数 <span>份 / 小时</span></h2>
      <div class="plot">
        <div class="bar-row"><span>路线 A</span><div class="track" aria-hidden="true"><div id="bar-a"></div></div><strong id="rate-a">—</strong></div>
        <div class="bar-row"><span>路线 B</span><div class="track" aria-hidden="true"><div id="bar-b"></div></div><strong id="rate-b">—</strong></div>
        <div class="axis" aria-hidden="true"><span>0</span><span id="scale-mid"></span><span id="scale-end"></span></div>
      </div>
      <p id="totals"></p>
    </div>
  </header>
  <section class="verdict" aria-label="本轮复盘">
    <div><h2>下一轮</h2><p id="recommendation"></p></div>
    <p id="adjustment"></p>
  </section>
  <section class="brief" aria-label="实验设置">
    <div class="brief-heading"><h2>实验设置</h2><button id="example" type="button">载入示例</button></div>
    <label>岗位<input id="job" maxlength="100"></label>
    <label>必要条件<textarea id="criteria" rows="3" maxlength="500"></textarea></label>
  </section>
  <div class="routes" id="routes"></div>
  <p id="storage" role="status"></p>
</main>
</body>
</html>
